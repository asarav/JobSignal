[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lodestar"
version = "0.0.0"
description = "Local-first job intelligence desktop worker (Lodestar)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  # M5: resume parsing.
  "pymupdf>=1.24",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
]
# Rendered-DOM extraction needs a browser. Install with:
#   pip install "lodestar[render]"
#   playwright install chromium
render = [
  "playwright>=1.48",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Discovery providers ship their seed lists as data files (M4).
"app.plugins.discovery" = ["seeds/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/application/commands/sources.py" = ["E501"]
"app/application/orchestration/scheduler.py" = ["E501"]
"app/application/sources.py" = ["E501"]
"app/worker/main.py" = ["E501"]
"app/application/commands/discovery.py" = ["E501"]
"app/application/commands/jobs.py" = ["E501"]
"app/plugins/ats/ashby/__init__.py" = ["E501"]
"app/plugins/ats/career_site.py" = ["E501"]
"app/plugins/ats/greenhouse/__init__.py" = ["E501"]
"app/plugins/ats/icims.py" = ["E501"]
"app/plugins/ats/smartrecruiters.py" = ["E501"]
"app/plugins/ats/lever/__init__.py" = ["E501"]
"app/plugins/extraction/rendered_dom.py" = ["E501"]
"app/plugins/ats/workday.py" = ["E501"]
"app/infrastructure/persistence/memory/__init__.py" = ["E501"]
"app/infrastructure/persistence/sqlite/repositories.py" = ["E501"]
"tests/contract/test_ashby.py" = ["E501"]
"tests/contract/test_greenhouse.py" = ["E501"]
"tests/contract/test_ats_connectors.py" = ["E501"]
"tests/contract/test_extraction_strategies.py" = ["E501"]
"tests/contract/test_lever.py" = ["E501"]
"tests/integration/test_crawl_run.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app.domain", "app.application"]
exclude = ["tests", "app/infrastructure", "app/plugins", "app/worker"]

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Domain may not import outer layers"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
  "app.application",
  "app.infrastructure",
  "app.plugins",
  "app.worker",
]

[[tool.importlinter.contracts]]
name = "Application may not import infrastructure, plugins, or worker"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.infrastructure", "app.plugins", "app.worker"]

[[tool.importlinter.contracts]]
name = "Infrastructure may not import worker"
type = "forbidden"
source_modules = ["app.infrastructure"]
forbidden_modules = ["app.worker"]

[[tool.importlinter.contracts]]
name = "Plugins may not import worker or application"
type = "forbidden"
source_modules = ["app.plugins"]
forbidden_modules = ["app.worker", "app.application"]

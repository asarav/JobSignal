name: Desktop builds

# Native Tauri bundles must be produced on their target OS. Run this workflow
# from the Actions tab to download Windows, Linux, and macOS installers.
#
# macOS is a per-architecture matrix (Intel and Apple silicon), not a universal
# target: each runner freezes its own worker sidecar and Tauri bundles that
# exact triple. A universal-apple-darwin target would require lipo-merging the
# two sidecars first and is intentionally not configured here.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release from these installers"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag, for example v0.1.0 (required when publish_release is true)"
        required: false
        type: string
      draft_release:
        description: "Keep the release as a draft"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: job-signal-windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: job-signal-linux-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: job-signal-macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: job-signal-macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install worker build dependencies
        # Never fall back to a PyMuPDF sdist: building MuPDF from source takes
        # hours, so a missing wheel (macOS Intel) should fail fast and loudly.
        env:
          PIP_ONLY_BINARY: pymupdf
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build worker sidecar
        run: python scripts/build_worker.py --target ${{ matrix.target }}

      - name: Delete-all-data end-to-end (real sidecar)
        working-directory: frontend/src-tauri
        run: cargo test --test delete_all_data_e2e -- --nocapture

      - name: Build native bundles
        working-directory: frontend
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Sidecar handshake smoke
        shell: bash
        run: python scripts/smoke_worker_sidecar.py --target ${{ matrix.target }}

      - name: Verify macOS signature when configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          APP=$(find "frontend/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle was produced."
            exit 1
          fi
          if [ -n "$APPLE_CERTIFICATE" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP"
            spctl -a -vv "$APP"
          else
            echo "::warning::No Apple signing certificate configured; $APP is unsigned (release gate)."
            codesign -dv "$APP" 2>&1 || true
          fi

      - name: Packaged app smoke (MSI)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          MSI=$(find "frontend/src-tauri/target/${{ matrix.target }}/release/bundle/msi" -name '*.msi' | head -1)
          python scripts/smoke_packaged_app.py --msi "$MSI"

      - name: Packaged app smoke (AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          IMG=$(find "frontend/src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -name '*.AppImage' | head -1)
          chmod +x "$IMG"
          python scripts/smoke_packaged_app.py --appimage "$IMG"

      - name: Packaged app smoke (macOS, unsigned)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(find "frontend/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)
          python scripts/smoke_packaged_app.py --macos-app "$APP" --timeout 240

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: bundle
    if: inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a release tag
        if: inputs.release_tag == ''
        run: |
          echo "::error::Set release_tag when publish_release is true."
          exit 1

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Job Signal ${{ inputs.release_tag }}
          draft: ${{ inputs.draft_release }}
          generate_release_notes: true
          # Bundle directories also contain the AppImage's unpacked runtime
          # (shared libraries, Gio typelibs, AppRun, the worker sidecar).
          # Uploading the whole tree turned one release into 260+ assets, so
          # ship only the files a user installs.
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.dmg
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.AppImage
          fail_on_unmatched_files: true

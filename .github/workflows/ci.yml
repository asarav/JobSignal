name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,render]"

      # The live Playwright suite skips when Chromium is absent. Installing it
      # on one OS makes the real "autofill never submits" tests CI-blocking
      # instead of something only a local machine ever exercises.
      - name: Install Chromium for the live autofill suite
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Ruff
        run: python -m ruff check app tests

      - name: Mypy (strict on domain + application)
        run: python -m mypy

      - name: Import boundaries
        run: python -c "from importlinter.cli import lint_imports_command; lint_imports_command()"

      - name: Pytest with coverage (unit, contract, integration, swapability)
        run: python -m pytest tests/ -q --cov=app --cov-report=term-missing:skip-covered

      # Spec section 19.1: domain >= 90%, application >= 85%, adapters >= 75%.
      - name: Coverage gates
        run: python scripts/check_coverage.py

  node:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Vitest
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node (Tauri embeds frontendDist at compile time)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test (allowlist + backoff)
        working-directory: frontend/src-tauri
        run: cargo test --lib

      - name: Cargo clippy (warnings are errors)
        working-directory: frontend/src-tauri
        run: cargo clippy --lib -- -D warnings

  schema:
    name: Schema and type freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          cd frontend
          npm ci --no-audit --no-fund

      - name: JSON Schema freshness
        run: python scripts/gen_schemas.py --check

      - name: TypeScript type freshness
        run: node scripts/gen-ts-types.mjs --check

      - name: No drift after regeneration
        run: git diff --exit-code
